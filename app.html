<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#0381FE">
    <title>HABIT Calendar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0381FE;
            --bg: #FCFCFC;
            --card: #FFFFFF;
            --bg2: #F2F3F5;
            --text: #1A1A1A;
            --text2: #8E8E93;
            --border: #E8E8E8;
            --danger: #F44336;
            --sun: #E2574C;
            --sat: #4A7BE2;
            --scrim: rgba(0,0,0,0.4);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #0A84FF;
                --bg: #000000;
                --card: #1C1C1E;
                --bg2: #2C2C2E;
                --text: #F2F2F7;
                --text2: #8E8E93;
                --border: #2C2C2E;
                --danger: #FF453A;
                --sun: #FF6961;
                --sat: #6E9BFF;
                --scrim: rgba(0,0,0,0.6);
            }
        }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            color: var(--text);
            background: var(--bg);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        body {
            display: flex;
            flex-direction: column;
            /* Use dynamic viewport height so layout adapts to Android WebView
               chrome / keyboard; JS also sets --app-height from visualViewport. */
            height: 100vh;
            height: 100dvh;
            height: var(--app-height, 100dvh);
            touch-action: none;
        }

        /* Header - thin line, One UI left-aligned label */
        #header {
            height: 48px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 6px 0 12px;
            gap: 4px;
            flex-shrink: 0;
        }
        #header h1 {
            font-size: 20px;
            font-weight: 700;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            min-height: 40px;
            letter-spacing: -0.3px;
        }
        #header h1::after {
            content: '⌄';
            font-size: 14px;
            font-weight: 400;
            color: var(--text2);
            margin-top: -4px;
        }
        #header h1:active { opacity: 0.6; }
        #header button {
            background: none;
            border: none;
            padding: 4px 6px;
            min-height: 40px;
            min-width: 36px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #header button:active { background: var(--bg2); border-radius: 8px; }
        /* Samsung-style Today button: rounded square showing today's date number */
        #today-btn {
            border: 1.5px solid var(--text2) !important;
            border-radius: 8px !important;
            font-size: 13px !important;
            font-weight: 600;
            min-width: 30px !important;
            width: 30px;
            height: 30px;
            min-height: 30px !important;
            padding: 0 !important;
            color: var(--text) !important;
        }
        #view-toggle {
            border: 1px solid var(--border) !important;
            border-radius: 8px !important;
            font-size: 12px !important;
        }

        /* Main layout */
        #main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar for filters */
        #sidebar {
            width: 50px;
            border-right: 1px solid var(--border);
            padding: 8px 4px;
            overflow-y: auto;
            overflow-x: hidden;
            flex-shrink: 0;
            transition: width 0.25s ease-out;
        }
        #sidebar.expanded { width: 160px; }
        #sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            cursor: pointer;
            color: var(--text2);
            font-size: 16px;
            border-radius: 8px;
        }
        #sidebar-toggle:active { background: var(--bg2); }
        .filter-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 4px;
            min-height: 40px;
            cursor: pointer;
            border-radius: 8px;
        }
        #sidebar.expanded .filter-item { justify-content: flex-start; padding: 8px 6px; }
        .filter-item input { width: 16px; height: 16px; flex-shrink: 0; }
        .filter-name {
            display: none;
            flex: 1;
            min-width: 0;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .filter-count { display: none; font-size: 11px; color: var(--text2); flex-shrink: 0; }
        #sidebar.expanded .filter-name, #sidebar.expanded .filter-count { display: block; }
        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-left: 4px;
            flex-shrink: 0;
        }
        #sidebar.expanded .color-dot { margin-left: 0; }

        /* Content area */
        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Calendar container */
        #calendar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Day headers */
        .day-headers {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .day-headers.zoom-5 { grid-template-columns: repeat(5, 1fr); }
        .day-headers.zoom-3 { grid-template-columns: repeat(3, 1fr); }
        .day-header {
            padding: 7px 0;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            color: var(--text2);
        }
        .day-header.sat { color: var(--sat); }
        .day-header.sun { color: var(--sun); }

        /* Month view grid */
        #month-view {
            flex: 1;
            display: grid;
            grid-template-rows: repeat(var(--month-rows, 6), 1fr);
        }

        /* Scroll view - scrollable weeks */
        #scroll-view {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            overscroll-behavior: contain;
        }
        #scroll-view .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            min-height: 80px;
            border-bottom: 1px solid var(--border);
        }

        /* Zoom support */
        #month-view, #scroll-view {
            --week-height: 80px;
            --total-days: 7;
        }
        #scroll-view .week-row {
            min-height: var(--week-height);
        }
        /* Month view: all weeks of the month must always fit above the divider.
           Rows share the available height equally (area / number-of-rows),
           independent of the scroll-view 4-week default week-height. */
        #month-view {
            grid-template-rows: repeat(var(--month-rows, 6), 1fr);
            min-height: 0;
        }
        #month-view .day-cell { min-height: 0; }
        /* Horizontal zoom - show fewer days */
        .week-row.zoom-5 { grid-template-columns: repeat(5, 1fr); }
        .week-row.zoom-5 .day-cell:nth-child(6),
        .week-row.zoom-5 .day-cell:nth-child(7) { display: none; }
        .week-row.zoom-3 { grid-template-columns: repeat(3, 1fr); }
        .week-row.zoom-3 .day-cell:nth-child(4),
        .week-row.zoom-3 .day-cell:nth-child(5),
        .week-row.zoom-3 .day-cell:nth-child(6),
        .week-row.zoom-3 .day-cell:nth-child(7) { display: none; }

        /* Shared day cell styles */
        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid var(--border);
        }
        .week-row:last-child { border-bottom: none; }
        .day-cell {
            padding: 3px 2px 2px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .day-cell:active { background: var(--bg2); }
        .day-cell.other-month .day-num { opacity: 0.4; }
        .day-cell.other-month .day-events { opacity: 0.5; }
        .day-num {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border-radius: 50%;
            margin: 0 auto 2px;
        }
        .day-cell.sat .day-num { color: var(--sat); }
        .day-cell.sun .day-num { color: var(--sun); }
        .day-cell.today .day-num {
            background: var(--primary);
            color: #fff !important;
            font-weight: 600;
        }
        .day-events {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        /* A timeline row spans the full cell width = the 00:00→23:59 axis.
           The bar inside is absolutely positioned by time-of-day. */
        .event-lane {
            position: relative;
            height: 15px;
            width: 100%;
            flex-shrink: 0;
        }
        .event-bar {
            position: absolute;
            top: 0;
            height: 15px;
            border-radius: 4px;
            padding: 0 3px;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            line-height: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
        }
        .event-bar.continuous {
            background: transparent !important;
            border: 1px solid;
        }
        .event-bar.done {
            opacity: 0.5;
            text-decoration: line-through;
        }
        .event-more {
            font-size: 10px;
            color: var(--text2);
            padding: 0 4px;
            font-weight: 500;
        }

        /* Divider */
        #divider {
            height: 2px;
            background: var(--border);
            cursor: ns-resize;
            position: relative;
            flex-shrink: 0;
            touch-action: none;
        }
        /* Visible handle: ~0.25cm wide x 0.5cm tall rectangle, centered */
        #divider-handle {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 0.25cm;
            height: 0.5cm;
            background: var(--text2);
            border-radius: 2px;
            z-index: 1;
        }
        /* Generous invisible touch target (>=44px) around the small handle */
        #divider-handle::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
        }

        /* Task panel */
        #task-panel {
            height: 25vh;
            height: 25dvh;
            min-height: 60px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
            padding: 8px;
            flex-shrink: 0;
        }
        #task-panel h2 {
            font-size: 11px;
            font-weight: 500;
            color: var(--text2);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        #task-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: var(--bg2);
            border-radius: 12px;
            border-left: 4px solid;
        }
        .task-item:active { opacity: 0.8; }
        .task-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); flex-shrink: 0; }
        .task-info { flex: 1; min-width: 0; }
        .task-title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .task-meta { font-size: 10px; color: var(--text2); }
        .task-item.completed {
            opacity: 0.6;
        }
        .task-item.completed .task-title {
            text-decoration: line-through;
        }
        .completed-header {
            font-size: 11px;
            font-weight: 500;
            color: var(--text2);
            padding: 8px 6px 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .completed-header::before {
            content: '▼';
            font-size: 8px;
            transition: transform 0.2s;
        }
        .completed-header.collapsed::before {
            transform: rotate(-90deg);
        }
        #completed-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #completed-section.collapsed {
            display: none;
        }

        /* FAB - 1cm from edges */
        #fab {
            position: fixed;
            bottom: 1cm;
            right: 1cm;
            width: 1cm;
            height: 1cm;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 24px;
            font-weight: 300;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(3,129,254,0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease-out;
        }
        #fab:active { transform: scale(0.92); }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card);
            border-radius: 26px;
            width: 100%;
            max-width: 380px;
            max-height: 90vh;
            max-height: 90dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            overscroll-behavior: contain;
        }
        .modal-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { font-size: 20px; font-weight: 700; }
        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text2);
            cursor: pointer;
            padding: 0;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -8px -8px -8px 0;
        }
        .modal-body { padding: 8px 16px 4px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: var(--bg2);
            color: var(--text);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }
        /* Large borderless title field (One UI) */
        #task-title {
            border: none !important;
            background: transparent !important;
            font-size: 22px !important;
            font-weight: 600;
            padding: 8px 0 !important;
            border-radius: 0 !important;
        }
        #task-title:focus { outline: none !important; border-bottom: 2px solid var(--primary) !important; }
        /* Color-circle selector row */
        .color-circles {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .color-circle {
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            border: 2px solid transparent;
        }
        .color-circle.selected {
            box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--primary);
        }
        .color-circle.add-new {
            background: var(--bg2);
            color: var(--text2);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 300;
            border: 1px dashed var(--border);
        }
        .form-row { display: flex; gap: 6px; }
        .form-row > * { flex: 1; }
        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: normal;
            margin: 0;
            font-size: 12px;
        }
        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px 16px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { opacity: 0.7; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: transparent; color: var(--text2); }
        .btn-danger { background: var(--danger); color: #fff; }
        /* One UI toggle switch */
        .toggle {
            position: relative;
            width: 46px; height: 28px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
        .toggle .track {
            position: absolute; inset: 0;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 14px;
            transition: background 0.2s;
        }
        .toggle .knob {
            position: absolute; top: 3px; left: 3px;
            width: 22px; height: 22px;
            background: var(--text2);
            border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }
        .toggle input:checked + .track { background: var(--primary); border-color: var(--primary); }
        .toggle input:checked ~ .knob { transform: translateX(18px); background: #fff; }
        #reminders-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
        .reminder-row { display: flex; gap: 6px; align-items: center; }
        .reminder-row input, .reminder-row select { flex: 1; padding: 6px; font-size: 12px; }
        .reminder-row button { background: none; border: none; color: #d93025; font-size: 16px; cursor: pointer; }
        .text-btn {
            background: var(--bg2);
            border: none;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            min-height: 36px;
        }
        .text-btn:active { opacity: 0.7; }
        .day-event-item {
            padding: 10px;
            background: var(--bg2);
            border-left: 3px solid;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .day-event-time { font-size: 10px; color: var(--text2); margin-bottom: 3px; }
        .day-event-title { font-weight: 500; font-size: 13px; }
        .settings-card {
            background: var(--bg2);
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
            padding: 14px 16px;
            min-height: 48px;
            font-size: 15px;
        }
        .setting-row + .setting-row { border-top: 1px solid var(--border); }
        .setting-row:active { background: var(--border); }
        .setting-row .chev { color: var(--text2); font-size: 20px; }
        .empty { text-align: center; color: var(--text2); padding: 16px; font-size: 12px; }
        .hidden { display: none !important; }

        /* ===== One UI bottom sheets ===== */
        .sheet {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2100;
        }
        .sheet.active { display: block; }
        .sheet-scrim {
            position: absolute;
            inset: 0;
            background: var(--scrim);
            opacity: 0;
            transition: opacity 0.25s ease-out;
        }
        .sheet.active .sheet-scrim { opacity: 1; }
        .sheet-panel {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--card);
            border-radius: 26px 26px 0 0;
            max-height: 85%;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.25s ease-out;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .sheet.active .sheet-panel { transform: translateY(0); }
        .sheet-grip {
            width: 36px;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            margin: 10px auto 4px;
            flex-shrink: 0;
        }
        .sheet-header {
            padding: 6px 24px 10px;
            font-size: 20px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .sheet-body {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
            padding: 0 16px 16px;
        }

        /* Agenda rows (day sheet) */
        .agenda-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px;
            border-radius: 14px;
            min-height: 48px;
        }
        .agenda-row:active { background: var(--bg2); }
        .agenda-bar {
            width: 4px;
            align-self: stretch;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .agenda-main { flex: 1; min-width: 0; }
        .agenda-time { font-size: 12px; color: var(--text2); }
        .agenda-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .agenda-row.done .agenda-title { text-decoration: line-through; opacity: 0.6; }
        .agenda-check { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--primary); }
        .agenda-add {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 8px;
            color: var(--primary);
            font-weight: 600;
            font-size: 15px;
            min-height: 48px;
        }
        .agenda-add:active { background: var(--bg2); border-radius: 14px; }
        .agenda-add .plus {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 300; line-height: 1;
        }

        /* Year/month picker */
        #picker-body { padding: 4px 16px 16px; }
        .picker-section-label {
            font-size: 12px; font-weight: 600; color: var(--text2);
            padding: 12px 8px 6px; text-transform: uppercase;
        }
        .picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .picker-cell {
            text-align: center;
            padding: 12px 0;
            border-radius: 12px;
            font-size: 14px;
            min-height: 44px;
            display: flex; align-items: center; justify-content: center;
        }
        .picker-cell:active { background: var(--bg2); }
        .picker-cell.selected { background: var(--primary); color: #fff; font-weight: 600; }
        .picker-cell.disabled { opacity: 0.3; pointer-events: none; }
        #picker-years {
            max-height: 200px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            overscroll-behavior: contain;
        }

        /* Task detail sheet actions */
        .detail-meta { padding: 0 8px 12px; }
        .detail-meta .dm-row { font-size: 14px; color: var(--text2); margin: 4px 0; }
        .detail-actions {
            display: flex;

            padding: 8px 8px 4px;
        }
        .detail-actions .btn { flex: 1; padding: 12px; border-radius: 14px; font-size: 15px; }
        .detail-actions .btn-soft { background: var(--bg2); color: var(--text); }

        /* Linear view */
        #linear-view {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
        }
        .linear-header {
            display: flex;
            border-bottom: 1px solid var(--border);
            min-width: fit-content;
        }
        .linear-day-header {
            min-width: 80px;
            padding: 4px;
            text-align: center;
            font-size: 10px;
            color: var(--text2);

            min-width: fit-content;
        }
        .linear-track {
            height: 24px;
            position: relative;
            border-bottom: 1px solid var(--border);
        }
        .linear-task {
            position: absolute;
            height: 20px;
            top: 2px;
            border-radius: 3px;
            font-size: 9px;
            color: #fff;
            padding: 0 4px;
            display: flex;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            cursor: pointer;
        }
        .linear-task.continuous {
            background: transparent !important;
            border: 2px solid;
            color: var(--text);
        }
        .linear-day-grid {
            position: absolute;
            top: 0;
            bottom: 0;
            border-right: 1px solid var(--border);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Day Agenda Bottom Sheet -->
