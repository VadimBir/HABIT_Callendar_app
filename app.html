    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-card">
                    <div class="setting-row">
                        <span>Enable notifications</span>
                        <label class="toggle">
                            <input type="checkbox" id="notif-toggle">
                            <span class="track"></span><span class="knob"></span>
                        </label>
                    </div>
                </div>
                <div class="settings-card">
                    <div class="setting-row" id="export-btn"><span>Export data</span><span class="chev">›</span></div>
                    <div class="setting-row" id="import-btn"><span>Import data</span><span class="chev">›</span></div>
                    <input type="file" id="import-file" accept=".json" hidden>
                </div>
                <div class="settings-card">
                    <div class="setting-row" id="clear-btn"><span style="color:var(--danger)">Clear all data</span><span class="chev">›</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== STORAGE =====
        const KEYS = { TASKS: 'habit_tasks', COLORS: 'habit_colors', SETTINGS: 'habit_settings' };
        function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        function getTasks() { return JSON.parse(localStorage.getItem(KEYS.TASKS) || '[]'); }
        function saveTasks(tasks) { localStorage.setItem(KEYS.TASKS, JSON.stringify(tasks)); }
        function getColors() {
            let colors = JSON.parse(localStorage.getItem(KEYS.COLORS) || '[]');
            if (!colors.length) {
                colors = [
                    { id: genId(), name: 'Work', color: '#69A1FA', count: 0 },
                    { id: genId(), name: 'Personal', color: '#5DC983', count: 0 },
                    { id: genId(), name: 'Health', color: '#EF7E73', count: 0 }
                ];
                saveColors(colors);
            }
            return colors;
        }
        function saveColors(colors) { localStorage.setItem(KEYS.COLORS, JSON.stringify(colors)); }
        // Recompute each calendar's usage count from the actual (non-completed)
        // tasks so the "sorted by usage" order never drifts.
        function colorUsageCounts() {
            const counts = {};
            getTasks().forEach(t => {
                if (t.completed) return;
                counts[t.colorGroupId] = (counts[t.colorGroupId] || 0) + 1;
            });
            return counts;
        }
        function getSettings() { return JSON.parse(localStorage.getItem(KEYS.SETTINGS) || '{"notifications":false}'); }
        function saveSettings(settings) { localStorage.setItem(KEYS.SETTINGS, JSON.stringify(settings)); }

        // ===== DYNAMIC AUTO-PROLONG =====
        // For every non-completed dynamic task whose dueDate is in the past,
        // repeatedly add one cadence step (D2D=+1d, W2W=+1w, M2M=+1mo) until
        // dueDate >= now. originalDueDate stays as the reference. postponeCount
        // accumulates the number of steps. Returns true if anything changed.
        function advanceDate(d, reminderType) {
            const n = new Date(d);
            if (reminderType === 'W2W') n.setDate(n.getDate() + 7);
            else if (reminderType === 'M2M') n.setMonth(n.getMonth() + 1);
            else n.setDate(n.getDate() + 1); // D2D default
            return n;
        }
        function prolongDynamicTasks() {
            const tasks = getTasks();
            const now = new Date();
            let changed = false;
            tasks.forEach(task => {
                if (task.type !== 'dynamic' || task.completed || !task.dueDate) return;
                let due = new Date(task.dueDate);
                if (due >= now) return;
                if (!task.originalDueDate) task.originalDueDate = task.dueDate;
                let steps = 0;
                let guard = 0;
                while (due < now && guard < 100000) {
                    due = advanceDate(due, task.reminderType);
                    steps++;
                    guard++;
                }
                if (steps > 0) {
                    // Shift startDate by the same delta so the span keeps its length
                    if (task.startDate) {
                        const delta = due.getTime() - new Date(task.dueDate).getTime();
                        task.startDate = new Date(new Date(task.startDate).getTime() + delta).toISOString();
                    }
                    task.dueDate = due.toISOString();
                    task.postponeCount = (task.postponeCount || 0) + steps;
                    // Spec: the earliest previous reminder re-fires daily against the
                    // new dueDate. Clear fired keys for the smallest reminder so the
                    // reminder scanner re-arms it against the moved dueDate.
                    if (Array.isArray(task.firedReminders) && task.reminders && task.reminders.length) {
                        const smallest = smallestReminderKeyPrefix(task.reminders);
                        if (smallest) {
                            task.firedReminders = task.firedReminders.filter(k => !k.startsWith(smallest + '@'));
                        }
                    }
                    changed = true;
                }
            });
            if (changed) saveTasks(tasks);
            return changed;
        }
        // Whole days between originalDueDate and current dueDate (display reference).
        function postponeDays(task) {
            if (!task.originalDueDate || !task.dueDate) return task.postponeCount || 0;
            const ms = new Date(task.dueDate) - new Date(task.originalDueDate);
            return Math.round(ms / 864e5);
        }
        // Suffix shown wherever a prolonged dynamic task's date appears.
        function prolongSuffix(task) {
            if (task.type !== 'dynamic') return '';
            const days = postponeDays(task);
            return days > 0 ? ` (+${days} days)` : '';
        }
        // The original (reference) date for display of a prolonged dynamic task.
        function displayDueDate(task) {
            if (task.type === 'dynamic' && task.originalDueDate && postponeDays(task) > 0) {
                return task.originalDueDate;
            }
            return task.dueDate;
        }

        // ===== REMINDERS =====
        const UNIT_MS = { minutes: 60000, hours: 3600000, days: 86400000, weeks: 604800000 };
        function reminderMs(r) { return (parseFloat(r.amount) || 0) * (UNIT_MS[r.unit] || 0); }
        function smallestReminderKeyPrefix(reminders) {
            let best = null, bestMs = Infinity;
            reminders.forEach(r => {
                const m = reminderMs(r);
                if (m < bestMs) { bestMs = m; best = r; }
            });
            return best ? `${best.amount}-${best.unit}` : null;
        }
        function showToast(msg) {
            let host = document.getElementById('toast-host');
            if (!host) {
                host = document.createElement('div');
                host.id = 'toast-host';
                host.style.cssText = 'position:fixed;left:50%;bottom:calc(1cm + 56px);transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;';
                document.body.appendChild(host);
            }
            const t = document.createElement('div');
            t.style.cssText = 'background:rgba(40,40,40,0.95);color:#fff;padding:10px 16px;border-radius:18px;font-size:13px;max-width:80vw;box-shadow:0 4px 16px rgba(0,0,0,0.3);';
            t.textContent = msg;
            host.appendChild(t);
            setTimeout(() => { t.style.transition = 'opacity 0.4s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 4000);
        }
        function fireReminder(task, r) {
            const msg = `${task.title} — due ${new Date(task.dueDate).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}`;
            const title = `Reminder: ${r.amount} ${r.unit} before`;
            if ('Notification' in window && Notification.permission === 'granted' && getSettings().notifications) {
                try { new Notification(title, { body: msg }); } catch (_) {}
            }
            showToast(`${title}\n${task.title}`);
        }
        // Scan tasks; fire any reminder whose fire time has passed but wasn't fired.
        function checkReminders() {
            const tasks = getTasks();
            const now = Date.now();
            let changed = false;
            tasks.forEach(task => {
                if (task.completed || !task.dueDate || !Array.isArray(task.reminders)) return;
                const dueMs = new Date(task.dueDate).getTime();
                if (!task.firedReminders) task.firedReminders = [];
                task.reminders.forEach(r => {
                    const fireAt = dueMs - reminderMs(r);
                    const key = `${r.amount}-${r.unit}@${task.dueDate}`;
                    if (task.firedReminders.includes(key)) return;
                    // Fire if its time has arrived (and not absurdly long ago, > 1 day stale skipped on first load)
                    if (fireAt <= now && now - fireAt < 86400000) {
                        fireReminder(task, r);
                        task.firedReminders.push(key);
                        changed = true;
                    } else if (fireAt <= now) {
                        // Stale (older than a day) — mark fired silently to avoid spam.
                        task.firedReminders.push(key);
                        changed = true;
                    }
                });
            });
            if (changed) saveTasks(tasks);
        }

        // Periodic tick: prolong dynamic tasks + check reminders.
        function periodicTick() {
            const changed = prolongDynamicTasks();
            checkReminders();
            if (changed) { renderFilters(); renderAll(); }
        }

        // ===== STATE =====
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let currentDay = new Date().getDate();
        let currentView = 'month'; // 'month', 'scroll', or 'linear'
        let editingTaskId = null;
        let visibleFilters = null; // null = all visible
        let linearDayWidth = 80; // Width of each day in linear view
        let linearDaysVisible = 14; // Number of days to show in linear view

        // ===== FILTERS =====
        // Persist sidebar expanded state + per-calendar checkbox states.
        function getUIState() {
            try { return JSON.parse(localStorage.getItem('habit_ui') || '{}'); } catch (_) { return {}; }
        }
        function saveUIState(s) { localStorage.setItem('habit_ui', JSON.stringify(s)); }
        let sidebarExpanded = !!getUIState().sidebarExpanded;
        function persistFilterStates() {
            const s = getUIState();
            s.sidebarExpanded = sidebarExpanded;
            const filters = {};
            document.querySelectorAll('#sidebar .filter-item').forEach(it => {
                filters[it.dataset.colorId] = it.querySelector('input').checked;
            });
            s.filters = filters;
            saveUIState(s);
        }
        function renderFilters() {
            const sidebar = document.getElementById('sidebar');
            const stored = getUIState().filters || {};
            // Preserve current checkbox states across re-renders
            const prevStates = {};
            sidebar.querySelectorAll('.filter-item').forEach(it => {
                prevStates[it.dataset.colorId] = it.querySelector('input').checked;
            });
            sidebar.innerHTML = '';
            sidebar.classList.toggle('expanded', sidebarExpanded);

            const toggle = document.createElement('div');
            toggle.id = 'sidebar-toggle';
            toggle.textContent = sidebarExpanded ? '«' : '»';
            toggle.title = 'Show calendar names';
            toggle.onclick = () => { sidebarExpanded = !sidebarExpanded; persistFilterStates(); renderFilters(); };
            sidebar.appendChild(toggle);

            const colors = getColors();
            const tasks = getTasks();
            colors.forEach(c => {
                const item = document.createElement('div');
                item.className = 'filter-item';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = prevStates[c.id] !== undefined ? prevStates[c.id]
                    : (stored[c.id] !== undefined ? stored[c.id] : true);
                cb.onchange = () => { persistFilterStates(); renderAll(); };
                const dot = document.createElement('div');
                dot.className = 'color-dot';
                dot.style.background = c.color;
                const name = document.createElement('span');
                name.className = 'filter-name';
                name.textContent = c.name || '';
                name.title = c.name || '';
                const count = document.createElement('span');
                count.className = 'filter-count';
                count.textContent = tasks.filter(t => t.colorGroupId === c.id && !t.completed).length || '';
                // Tapping anywhere on the row (except the checkbox itself) toggles it
                item.onclick = (e) => {
                    if (e.target !== cb) { cb.checked = !cb.checked; persistFilterStates(); renderAll(); }
                };
                item.appendChild(cb);
                item.appendChild(dot);
                item.appendChild(name);
                item.appendChild(count);
                item.dataset.colorId = c.id;
                sidebar.appendChild(item);
            });
        }

        function getVisibleColorIds() {
            const items = document.querySelectorAll('#sidebar .filter-item');
            const ids = [];
            items.forEach(item => {
                if (item.querySelector('input').checked) {
                    ids.push(item.dataset.colorId);
                }
            });
            return ids;
        }

        // ===== CALENDAR RENDERING =====
        function renderAll() {
            if (currentView === 'month') {
                renderMonthView();
            } else if (currentView === 'scroll') {
                renderScrollView();
            } else {
                renderLinearView();
            }
            renderTaskList();
            updateHeader();
        }

        function updateHeader() {
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            document.getElementById('month-title').textContent = `${months[currentMonth]} ${currentYear}`;
            const tb = document.getElementById('today-btn');
            if (tb) tb.textContent = new Date().getDate();
        }

        function renderMonthView() {
            const grid = document.getElementById('month-view');
            grid.innerHTML = '';

            const firstDay = new Date(currentYear, currentMonth, 1);
            const startOffset = (firstDay.getDay() + 6) % 7;
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - startOffset);

            const today = new Date();
            const tasks = getTasks();
            const colors = getColors();
            const visibleIds = getVisibleColorIds();

            // Render only the weeks the month actually spans (4, 5, or 6) so the
            // rows can be sized to available-height / rows and always fit.
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
            const numRows = Math.ceil((startOffset + lastDay) / 7);

            for (let week = 0; week < numRows; week++) {
                const row = document.createElement('div');
                row.className = 'week-row';

                for (let day = 0; day < 7; day++) {
                    const date = new Date(startDate);
                    date.setDate(startDate.getDate() + (week * 7) + day);
                    const cell = createDayCell(date, today, tasks, colors, visibleIds, currentMonth);
                    row.appendChild(cell);
                }
                grid.appendChild(row);
            }
            grid.style.setProperty('--month-rows', numRows);
        }

        // Earliest reachable week: the week containing the Unix epoch (Jan 1, 1970).
        const EPOCH_WEEK_START = (() => {
            const d = new Date(1970, 0, 1);
            d.setDate(d.getDate() - (d.getDay() + 6) % 7);
            return d;
        })();

        function renderScrollView() {
            const container = document.getElementById('scroll-view');
            container.innerHTML = '';

            const today = new Date();
            // Monday of the week 4 weeks before today's week
            let firstWeekStart = new Date(today);
            firstWeekStart.setDate(firstWeekStart.getDate() - (firstWeekStart.getDay() + 6) % 7 - 28);
            if (firstWeekStart < EPOCH_WEEK_START) firstWeekStart = new Date(EPOCH_WEEK_START);

            const tasks = getTasks();
            const colors = getColors();
            const visibleIds = getVisibleColorIds();

            function makeWeekRow(weekStart) {
                const row = document.createElement('div');
                row.className = 'week-row';
                for (let day = 0; day < 7; day++) {
                    const date = new Date(weekStart);
                    date.setDate(weekStart.getDate() + day);
                    row.appendChild(createDayCell(date, today, tasks, colors, visibleIds, null));
                }
                return row;
            }

            for (let week = 0; week < 20; week++) {
                const weekStart = new Date(firstWeekStart);
                weekStart.setDate(firstWeekStart.getDate() + week * 7);
                container.appendChild(makeWeekRow(weekStart));
            }

            // Scroll to show current week in middle
            setTimeout(() => {
                const weekHeight = container.firstChild ? container.firstChild.offsetHeight : 80;
                const weeksBeforeToday = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate() - (today.getDay() + 6) % 7) - firstWeekStart) / (7 * 864e5));
                container.scrollTop = weekHeight * weeksBeforeToday;
            }, 10);

            // Update header on scroll; load more weeks in BOTH directions
            // (future is unbounded, past is clamped at the epoch week).
            container.onscroll = () => {
                const weekHeight = container.firstChild ? container.firstChild.offsetHeight : 80;
                const scrolledWeeks = Math.floor(container.scrollTop / weekHeight);
                const visibleDate = new Date(firstWeekStart);
                visibleDate.setDate(visibleDate.getDate() + scrolledWeeks * 7);
                currentMonth = visibleDate.getMonth();
                currentYear = visibleDate.getFullYear();
                updateHeader();

                // Near bottom: append future weeks
                if (container.scrollTop + container.clientHeight >= container.scrollHeight - weekHeight * 2) {
                    const lastWeekStart = new Date(firstWeekStart);
                    lastWeekStart.setDate(lastWeekStart.getDate() + container.children.length * 7);
                    for (let week = 0; week < 10; week++) {
                        const weekStart = new Date(lastWeekStart);
                        weekStart.setDate(lastWeekStart.getDate() + week * 7);
                        container.appendChild(makeWeekRow(weekStart));
                    }
                }

                // Near top: prepend past weeks down to the epoch
                if (container.scrollTop <= weekHeight * 2 && firstWeekStart > EPOCH_WEEK_START) {
                    const weeksAvailable = Math.round((firstWeekStart - EPOCH_WEEK_START) / (7 * 864e5));
                    const toAdd = Math.min(10, weeksAvailable);
                    for (let week = 1; week <= toAdd; week++) {
                        const weekStart = new Date(firstWeekStart);
                        weekStart.setDate(firstWeekStart.getDate() - week * 7);
                        container.insertBefore(makeWeekRow(weekStart), container.firstChild);
                    }
                    firstWeekStart.setDate(firstWeekStart.getDate() - toAdd * 7);
                    // Keep the viewport anchored on the same week
                    container.scrollTop += weekHeight * toAdd;
                }
            };
        }

        function renderLinearView() {
            const container = document.getElementById('linear-view');
            container.innerHTML = '';

            const today = new Date();
            const startDate = new Date(currentYear, currentMonth, currentDay);
            startDate.setDate(startDate.getDate() - 3); // Start 3 days before current

            const tasks = getTasks();
            const colors = getColors();
            const visibleIds = getVisibleColorIds();

            // Create day headers
            const header = document.createElement('div');
            header.className = 'linear-header';
            for (let i = 0; i < linearDaysVisible; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                const dayHeader = document.createElement('div');
                dayHeader.className = 'linear-day-header';
                if (date.toDateString() === today.toDateString()) {
                    dayHeader.classList.add('today');
                }
                dayHeader.style.minWidth = linearDayWidth + 'px';
                dayHeader.innerHTML = `${date.getDate()}<br>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][date.getDay()]}`;
                header.appendChild(dayHeader);
            }
            container.appendChild(header);

            // Get tasks sorted by due date (earliest first = top track)
            const activeTasks = tasks.filter(t => !t.completed && visibleIds.includes(t.colorGroupId));
            activeTasks.sort((a, b) => {
                if (!a.dueDate) return 1;
                if (!b.dueDate) return -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });

            // Create tracks container
            const tracks = document.createElement('div');
            tracks.className = 'linear-tracks';
            tracks.style.width = (linearDayWidth * linearDaysVisible) + 'px';

            // Add day grid lines
            for (let i = 0; i < linearDaysVisible; i++) {
                const gridLine = document.createElement('div');
                gridLine.className = 'linear-day-grid';
                gridLine.style.left = (i * linearDayWidth) + 'px';
                gridLine.style.width = linearDayWidth + 'px';
                tracks.appendChild(gridLine);
            }

            // Create tracks for each task
            activeTasks.forEach(task => {
                const track = document.createElement('div');
                track.className = 'linear-track';

                const color = colors.find(c => c.id === task.colorGroupId);
                const taskStart = task.startDate ? new Date(task.startDate) : (task.createdAt ? new Date(task.createdAt) : new Date(task.dueDate));
                const taskEnd = task.dueDate ? new Date(task.dueDate) : new Date();

                // Calculate position within visible range
                const viewStart = startDate.getTime();
                const viewEnd = new Date(startDate).setDate(startDate.getDate() + linearDaysVisible);

                // Check if task is visible in current range
                if (taskEnd.getTime() >= viewStart && taskStart.getTime() <= viewEnd) {
                    const startOffset = Math.max(0, (taskStart.getTime() - viewStart) / (1000 * 60 * 60 * 24));
                    const endOffset = Math.min(linearDaysVisible, (taskEnd.getTime() - viewStart) / (1000 * 60 * 60 * 24));

                    const taskEl = document.createElement('div');
                    taskEl.className = 'linear-task';
                    if (task.type === 'continuous') {
                        taskEl.classList.add('continuous');
                        taskEl.style.borderColor = color ? color.color : '#999';
                    } else {
                        taskEl.style.backgroundColor = color ? color.color : '#999';
                    }
                    taskEl.style.left = (startOffset * linearDayWidth) + 'px';
                    taskEl.style.width = Math.max(20, (endOffset - startOffset) * linearDayWidth) + 'px';
                    taskEl.textContent = task.title;
                    taskEl.onclick = () => showTaskDetail(task);
                    track.appendChild(taskEl);
                }

                tracks.appendChild(track);
            });

            container.appendChild(tracks);
        }

        // Linear view horizontal drag scrolling (bound ONCE to avoid stacking
        // duplicate listeners on every renderLinearView call).
        (function setupLinearDrag() {
            const container = document.getElementById('linear-view');
            let isDraggingLinear = false;
            let linearStartX = 0;
            let linearScrollLeft = 0;

            container.addEventListener('mousedown', (e) => {
                isDraggingLinear = true;
                linearStartX = e.pageX - container.offsetLeft;
                linearScrollLeft = container.scrollLeft;
            });
            container.addEventListener('mousemove', (e) => {
                if (!isDraggingLinear) return;
                e.preventDefault();
                const x = e.pageX - container.offsetLeft;
                const walk = (x - linearStartX);
                container.scrollLeft = linearScrollLeft - walk;
            });
            container.addEventListener('mouseup', () => { isDraggingLinear = false; });
            container.addEventListener('mouseleave', () => { isDraggingLinear = false; });

            // Touch: single-finger drag pans; native overflow scroll handles it,
            // so we only assist for environments without momentum scrolling.
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    linearStartX = e.touches[0].pageX;
                    linearScrollLeft = container.scrollLeft;
                }
            });
            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    const x = e.touches[0].pageX;
                    const walk = (x - linearStartX);
                    container.scrollLeft = linearScrollLeft - walk;
                }
            });
        })();

        // ===== COLOR UTILITIES (One UI pastel chips) =====
        function hexToRgb(hex) {
            hex = (hex || '#999999').replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            return {
                r: parseInt(hex.substr(0, 2), 16) || 0,
                g: parseInt(hex.substr(2, 2), 16) || 0,
                b: parseInt(hex.substr(4, 2), 16) || 0
            };
        }
        function isDarkMode() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        // Translucent pastel fill of the calendar color
        function pastelFill(hex) {
            const { r, g, b } = hexToRgb(hex);
            return isDarkMode()
                ? `rgba(${r},${g},${b},0.30)`
                : `rgba(${r},${g},${b},0.18)`;
        }
        // Darker / lighter same-hue text for legibility on the pastel fill
        function pastelText(hex) {
            const { r, g, b } = hexToRgb(hex);
            if (isDarkMode()) {
                const lr = Math.min(255, r + 90), lg = Math.min(255, g + 90), lb = Math.min(255, b + 90);
                return `rgb(${lr},${lg},${lb})`;
            }
            const dr = Math.round(r * 0.62), dg = Math.round(g * 0.62), db = Math.round(b * 0.62);
            return `rgb(${dr},${dg},${db})`;
        }
        function styleEventBar(bar, color, isContinuous) {
            const hex = color ? color.color : '#999999';
            if (isContinuous) {
                bar.classList.add('continuous');
                bar.style.borderColor = hex;
                bar.style.color = pastelText(hex);
            } else {
                bar.style.backgroundColor = pastelFill(hex);
                bar.style.color = pastelText(hex);
            }
        }

        function createDayCell(date, today, tasks, colors, visibleIds, currentMonthForGray) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            const dow = date.getDay();
            if (dow === 6) cell.classList.add('sat');
            if (dow === 0) cell.classList.add('sun');

            if (currentMonthForGray !== null && date.getMonth() !== currentMonthForGray) {
                cell.classList.add('other-month');
            }

            if (date.toDateString() === today.toDateString()) {
                cell.classList.add('today');
            }

            const num = document.createElement('div');
            num.className = 'day-num';
            num.textContent = date.getDate();
            cell.appendChild(num);

            const events = document.createElement('div');
            events.className = 'day-events';

            let dayTasks = getTasksForDate(tasks, date).filter(t => visibleIds.includes(t.colorGroupId));
            // Sort: most-used color group first, then earliest due time (spec 6).
            const freq = colorUsageCounts();
            dayTasks = sortByGroupThenTime(dayTasks, freq, dueTimeKey);

            // How many bars fit: each lane ~15px + 2px gap; reserve a row for "+N".
            const availH = Math.max(0, weekHeight - 28);
            const maxShow = Math.max(1, Math.floor(availH / 17));

            dayTasks.slice(0, maxShow).forEach(task => {
                const lane = document.createElement('div');
                lane.className = 'event-lane';
                const bar = document.createElement('div');
                bar.className = 'event-bar';
                const color = colors.find(c => c.id === task.colorGroupId);
                const isContinuous = task.type === 'continuous';
                styleEventBar(bar, color, isContinuous);

                // Time-proportional position on the 00:00→23:59 axis for this date.
                const { leftPct, rightPct } = barExtentForDate(task, date, isContinuous);
                bar.style.left = leftPct + '%';
                bar.style.width = Math.max(2, rightPct - leftPct) + '%';

                if (task.completed) bar.classList.add('done');

                // Dynamic font size: scale 6px (narrow/long) → 12px (wide/short).
                const widthFrac = (rightPct - leftPct) / 100;
                const cellW = Math.max(20, (cell.clientWidth || 48));
                const barPx = Math.max(8, widthFrac * cellW);
                let title = task.title + prolongSuffix(task);
                const fontPx = Math.max(6, Math.min(12, Math.round(barPx / Math.max(2, title.length) * 1.6)));
                bar.style.fontSize = fontPx + 'px';
                bar.textContent = title;
                bar.title = title;
                bar.onclick = (e) => { e.stopPropagation(); showTaskDetail(task); };
                lane.appendChild(bar);
                events.appendChild(lane);
            });

            if (dayTasks.length > maxShow) {
                const more = document.createElement('div');
                more.className = 'event-more';
                more.textContent = `+${dayTasks.length - maxShow}`;
                events.appendChild(more);
            }

            cell.appendChild(events);
            cell.onclick = () => showDayModal(date);
            return cell;
        }

        // Sort: most-used color group first (frequency = count of non-completed
        // tasks in that group), then by earliest due time. Completed last.
        // `freq` is a map colorGroupId -> count (computed once per render).
        function sortByGroupThenTime(list, freq, timeKey) {
            return list.slice().sort((a, b) => {
                if (!!a.completed !== !!b.completed) return a.completed ? 1 : -1;
                const fa = freq[a.colorGroupId] || 0, fb = freq[b.colorGroupId] || 0;
                if (fb !== fa) return fb - fa;
                const ta = timeKey(a), tb = timeKey(b);
                if (ta == null) return 1;
                if (tb == null) return -1;
                return ta - tb;
            });
        }
        function dueTimeKey(t) { return t.dueDate ? new Date(t.dueDate).getTime() : null; }

        // Percent-of-day for a Date (0 = 00:00, 100 = 23:59).
        function timeOfDayPct(d) {
            return ((d.getHours() * 60 + d.getMinutes()) / 1440) * 100;
        }
        // Horizontal extent {leftPct,rightPct} of a task's bar on a given cell date,
        // mapping time-of-day onto a 00:00→23:59 axis. Handles single/multi-day,
        // continuous (from createdAt), and completed truncation at done-time.
        function barExtentForDate(task, date, isContinuous) {
            const dStr = formatDate(date);
            if (isContinuous) {
                const created = new Date(task.createdAt);
                const completed = task.completedAt ? new Date(task.completedAt) : null;
                let left = (formatDate(created) === dStr) ? timeOfDayPct(created) : 0;
                let right = 100;
                if (completed && formatDate(completed) === dStr) right = timeOfDayPct(completed);
                return { leftPct: left, rightPct: Math.max(left + 2, right) };
            }
            const start = task.startDate ? new Date(task.startDate) : new Date(task.dueDate);
            const due = new Date(task.dueDate);
            const startStr = formatDate(start), dueStr = formatDate(due);
            let left = 0, right = 100;
            if (startStr === dueStr) { left = timeOfDayPct(start); right = timeOfDayPct(due); }
            else if (dStr === startStr) { left = timeOfDayPct(start); right = 100; }
            else if (dStr === dueStr) { left = 0; right = timeOfDayPct(due); }
            else { left = 0; right = 100; }
            // Completed fixed/dynamic: end the bar at done-time on the done day (spec 6.1).
            if (task.completed && task.completedAt) {
                const done = new Date(task.completedAt);
                if (formatDate(done) === dStr) {
                    const donePct = timeOfDayPct(done);
                    right = donePct;
                    if (left >= right) left = Math.max(0, right - 2); // point-task ends at done-time
                }
            }
            return { leftPct: left, rightPct: Math.max(left + 2, right) };
        }

        function getTasksForDate(tasks, date) {
            const dateStr = formatDate(date);
            return tasks.filter(task => {
                if (task.type === 'continuous') {
                    const created = new Date(task.createdAt);
                    const completed = task.completedAt ? new Date(task.completedAt) : null;
                    return created <= date && (!completed || completed >= date);
                }
                let start = task.startDate ? formatDate(new Date(task.startDate)) : formatDate(new Date(task.dueDate));
                let end = formatDate(new Date(task.dueDate));
                // Completed fixed/dynamic tasks end at done-time: keep showing them
                // through their done-day (spec 6.1) but not beyond.
                if (task.completed && task.completedAt) {
                    const doneStr = formatDate(new Date(task.completedAt));
                    if (doneStr < end) end = doneStr;
                }
                return dateStr >= start && dateStr <= end;
            });
        }

        function formatDate(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        // ===== TASK LIST =====
        function getTimeLeft(dueDate) {
            if (!dueDate) return '';
            const now = new Date();
            const due = new Date(dueDate);
            const diff = due - now;

            if (diff < 0) {
                const hours = Math.abs(Math.floor(diff / (1000 * 60 * 60)));
                if (hours < 24) return `${hours}h overdue`;
                const days = Math.floor(hours / 24);
                return `${days}d overdue`;
            }

            const minutes = Math.floor(diff / (1000 * 60));
            if (minutes < 60) return `${minutes}m left`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h left`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d left`;
            const weeks = Math.floor(days / 7);
            return `${weeks}w left`;
        }

        function renderTaskList() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';

            const allTasks = getTasks();
            const colors = getColors();
            const visibleIds = getVisibleColorIds();

            // Separate active and completed tasks
            const activeTasks = allTasks.filter(t => !t.completed && visibleIds.includes(t.colorGroupId));
            const completedTasks = allTasks.filter(t => t.completed && visibleIds.includes(t.colorGroupId));

            // Sort by color-group frequency (most-used first), then closest end time (spec 8)
            const freq = colorUsageCounts();
            const sorted = sortByGroupThenTime(activeTasks, freq, dueTimeKey);
            activeTasks.length = 0;
            activeTasks.push(...sorted);

            // Sort completed by completion date (most recent first)
            completedTasks.sort((a, b) => {
                if (!a.completedAt) return 1;
                if (!b.completedAt) return -1;
                return new Date(b.completedAt) - new Date(a.completedAt);
            });

            if (!activeTasks.length && !completedTasks.length) {
                list.innerHTML = '<div class="empty">No tasks</div>';
                return;
            }

            // Render active tasks
            activeTasks.forEach(task => {
                list.appendChild(createTaskItem(task, colors, false));
            });

            // Render completed section
            if (completedTasks.length) {
                const completedHeader = document.createElement('div');
                completedHeader.className = 'completed-header';
                completedHeader.innerHTML = `<span>Completed (${completedTasks.length})</span>`;
                completedHeader.onclick = () => {
                    const section = document.getElementById('completed-section');
                    section.classList.toggle('collapsed');
                    completedHeader.classList.toggle('collapsed');
                };
                list.appendChild(completedHeader);

                const completedSection = document.createElement('div');
                completedSection.id = 'completed-section';
                completedTasks.forEach(task => {
                    completedSection.appendChild(createTaskItem(task, colors, true));
                });
                list.appendChild(completedSection);
            }
        }

        function createTaskItem(task, colors, isCompleted) {
            const item = document.createElement('div');
            item.className = 'task-item' + (isCompleted ? ' completed' : '');
            const color = colors.find(c => c.id === task.colorGroupId);
            item.style.borderLeftColor = color ? color.color : '#999';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed;
            checkbox.onchange = () => toggleTask(task.id);

            const info = document.createElement('div');
            info.className = 'task-info';
            info.onclick = () => showTaskModal(task);

            const title = document.createElement('div');
            title.className = 'task-title';
            title.textContent = task.title;

            const meta = document.createElement('div');
            meta.className = 'task-meta';

            if (isCompleted && task.completedAt) {
                const d = new Date(task.completedAt);
                meta.textContent = 'Done ' + d.toLocaleDateString([], {month:'short', day:'numeric'});
            } else if (task.dueDate) {
                const suffix = prolongSuffix(task);
                if (suffix) {
                    // Show the ORIGINAL date as the reference plus "(+X days)".
                    const od = new Date(task.originalDueDate);
                    meta.textContent = od.toLocaleDateString([], {month:'short', day:'numeric'}) + suffix;
                } else {
                    meta.textContent = getTimeLeft(task.dueDate);
                }
            }

            info.appendChild(title);
            info.appendChild(meta);
            item.appendChild(checkbox);
            item.appendChild(info);
            return item;
        }

        function toggleTask(id) {
            const tasks = getTasks();
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                task.completedAt = task.completed ? new Date().toISOString() : null;
                saveTasks(tasks);
                renderAll();
            }
        }

        // ===== VIEW TOGGLE =====
        function toggleView() {
            document.getElementById('month-view').classList.add('hidden');
            document.getElementById('scroll-view').classList.add('hidden');
            document.getElementById('linear-view').classList.add('hidden');

            if (currentView === 'month') {
                currentView = 'scroll';
                document.getElementById('scroll-view').classList.remove('hidden');
                document.getElementById('view-toggle').textContent = 'Scroll';
            } else if (currentView === 'scroll') {
                currentView = 'linear';
                document.getElementById('linear-view').classList.remove('hidden');
                document.getElementById('view-toggle').textContent = 'Linear';
                document.querySelector('.day-headers').classList.add('hidden');
            } else {
                currentView = 'month';
                document.getElementById('month-view').classList.remove('hidden');
                document.getElementById('view-toggle').textContent = 'Month';
                document.querySelector('.day-headers').classList.remove('hidden');
            }
            renderAll();
        }

        // ===== NAVIGATION =====
        // Earliest navigable month: January 1970 (epoch floor, matches scroll view).
        const EPOCH_YEAR = 1970, EPOCH_MONTH = 0;
        function atEpochFloor(year, month) {
            return year < EPOCH_YEAR || (year === EPOCH_YEAR && month <= EPOCH_MONTH);
        }
        function prevMonth() {
            if (currentView === 'linear') {
                // Move back 7 days in linear view (clamped to epoch)
                const d = new Date(currentYear, currentMonth, currentDay - 7);
                if (atEpochFloor(d.getFullYear(), d.getMonth()) && d < new Date(EPOCH_YEAR, EPOCH_MONTH, 1)) return;
                currentYear = d.getFullYear();
                currentMonth = d.getMonth();
                currentDay = d.getDate();
            } else {
                if (atEpochFloor(currentYear, currentMonth)) return; // already at floor
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
            }
            renderAll();
        }

        function nextMonth() {
            if (currentView === 'linear') {
                // Move forward 7 days in linear view
                const d = new Date(currentYear, currentMonth, currentDay + 7);
                currentYear = d.getFullYear();
                currentMonth = d.getMonth();
                currentDay = d.getDate();
            } else {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
            }
            renderAll();
        }

        // ===== MODALS =====
        function showTaskModal(task = null, prefillDate = null) {
            editingTaskId = task ? task.id : null;
            document.getElementById('task-title').value = task ? task.title : '';
            document.getElementById('task-type').value = task ? task.type : 'fixed';
            document.getElementById('task-desc').value = task ? (task.description || '') : '';
            let defaultEnd = '';
            if (!task && prefillDate) {
                const d = new Date(prefillDate);
                d.setHours(9, 0, 0, 0);
                defaultEnd = formatDateTimeLocal(d.toISOString());
            }
            document.getElementById('task-start').value = task && task.startDate ? formatDateTimeLocal(task.startDate) : '';
            document.getElementById('task-end').value = task && task.dueDate ? formatDateTimeLocal(task.dueDate) : defaultEnd;
            updateColorSelect(task ? task.colorGroupId : null);
            // Restore the task's cadence, or default to D2D for new tasks
            const cadence = (task && task.reminderType) || 'D2D';
            document.querySelectorAll('input[name="rtype"]').forEach(r => { r.checked = r.value === cadence; });
            updateTypeVisibility();
            document.getElementById('reminders-list').innerHTML = '';
            if (task && task.reminders) {
                task.reminders.forEach(r => addReminderRow(r));
                updateCadenceHint();
            } else {
                // New task: prefill the default reminder set for the cadence
                applyCadencePresets();
            }
            document.getElementById('task-modal').classList.add('active');
        }

        function hideTaskModal() {
            document.getElementById('task-modal').classList.remove('active');
            editingTaskId = null;
        }

        // ===== Bottom-sheet helpers =====
        function openSheet(id) { document.getElementById(id).classList.add('active'); }
        function closeSheet(id) { document.getElementById(id).classList.remove('active'); }

        let daySheetDate = null;
        function showDayModal(date) {
            daySheetDate = new Date(date);
            document.getElementById('day-title').textContent = date.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
            const events = document.getElementById('day-events');
            events.innerHTML = '';

            const tasks = getTasksForDate(getTasks(), date);
            const colors = getColors();
            const visibleIds = getVisibleColorIds();
            const filtered = tasks.filter(t => visibleIds.includes(t.colorGroupId));

            // Sort: most-used color group first, then earliest due time (spec 6)
            const freq = colorUsageCounts();
            const sortedDay = sortByGroupThenTime(filtered, freq, dueTimeKey);
            filtered.length = 0;
            filtered.push(...sortedDay);

            if (!filtered.length) {
                events.innerHTML = '<div class="empty">No events</div>';
            } else {
                filtered.forEach(task => {
                    const row = document.createElement('div');
                    row.className = 'agenda-row' + (task.completed ? ' done' : '');
                    const color = colors.find(c => c.id === task.colorGroupId);

                    const bar = document.createElement('div');
                    bar.className = 'agenda-bar';
                    bar.style.background = color ? color.color : '#999';

                    const main = document.createElement('div');
                    main.className = 'agenda-main';
                    if (task.dueDate) {
                        const time = document.createElement('div');
                        time.className = 'agenda-time';
                        const start = task.startDate ? new Date(task.startDate) : null;
                        const due = new Date(task.dueDate);
                        const fmt = d => d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                        time.textContent = start && start.toDateString() !== due.toDateString()
                            ? fmt(due) : (start ? `${fmt(start)} – ${fmt(due)}` : fmt(due));
                        main.appendChild(time);
                    } else if (task.type === 'continuous') {
                        const time = document.createElement('div');
                        time.className = 'agenda-time';
                        time.textContent = 'Ongoing';
                        main.appendChild(time);
                    }
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'agenda-title';
                    titleDiv.textContent = task.title + prolongSuffix(task);
                    main.appendChild(titleDiv);

                    const check = document.createElement('input');
                    check.type = 'checkbox';
                    check.className = 'agenda-check';
                    check.checked = !!task.completed;
                    check.onclick = (e) => { e.stopPropagation(); toggleTask(task.id); row.classList.toggle('done', !task.completed); };

                    main.onclick = () => { closeSheet('day-sheet'); showTaskDetail(task); };

                    row.appendChild(bar);
                    row.appendChild(main);
                    row.appendChild(check);
                    events.appendChild(row);
                });
            }

            // Add (+) row that prefills the form with this date
            const addRow = document.createElement('div');
            addRow.className = 'agenda-add';
            addRow.innerHTML = '<span class="plus">+</span><span>Add event</span>';
            addRow.onclick = () => { closeSheet('day-sheet'); showTaskModal(null, daySheetDate); };
            events.appendChild(addRow);

            openSheet('day-sheet');
        }

        // ===== TASK DETAIL SHEET =====
        let detailTaskId = null;
        function showTaskDetail(task) {
            detailTaskId = task.id;

            const color = colors.find(c => c.id === task.colorGroupId);
            document.getElementById('detail-title').textContent = task.title;
            const meta = document.getElementById('detail-meta');

            const add = (txt) => { const d = document.createElement('div'); d.className = 'dm-row'; d.textContent = txt; meta.appendChild(d); };

                const suffix = prolongSuffix(task);
                let line;
                if (suffix && task.originalDueDate) {
                    line = 'Due: ' + new Date(task.originalDueDate).toLocaleDateString() + suffix;

        // ===== YEAR/MONTH PICKER =====
        let pickYear = null, pickMonth = null;
        function showPicker() {
            pickYear = currentYear;
            pickMonth = currentMonth;
            renderPicker();
            openSheet('picker-sheet');
            // Scroll selected year into view
            setTimeout(() => {
                const sel = document.querySelector('#picker-years .picker-cell.selected');
                if (sel) sel.scrollIntoView({ block: 'center' });
            }, 30);
        }
        function renderPicker() {
            const yearsEl = document.getElementById('picker-years');
            const monthsEl = document.getElementById('picker-months');
            const nowYear = new Date().getFullYear();
            const lastYear = Math.max(nowYear + 10, currentYear + 5);
            yearsEl.innerHTML = '';
            for (let y = EPOCH_YEAR; y <= lastYear; y++) {
                const cell = document.createElement('div');
                cell.className = 'picker-cell' + (y === pickYear ? ' selected' : '');
                cell.textContent = y;
                cell.onclick = () => { pickYear = y; if (pickYear === EPOCH_YEAR && pickMonth < EPOCH_MONTH) pickMonth = EPOCH_MONTH; renderPicker(); };
                yearsEl.appendChild(cell);
            }
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            monthsEl.innerHTML = '';
            months.forEach((m, i) => {
                const cell = document.createElement('div');
                let cls = 'picker-cell';
                if (i === pickMonth) cls += ' selected';
                if (pickYear === EPOCH_YEAR && i < EPOCH_MONTH) cls += ' disabled';
                cell.className = cls;
                cell.textContent = m;
                cell.onclick = () => { pickMonth = i; applyPicker(); };
                monthsEl.appendChild(cell);
            });
        }
        function applyPicker() {
            if (atEpochFloor(pickYear, pickMonth)) { pickYear = EPOCH_YEAR; pickMonth = EPOCH_MONTH; }
            currentYear = pickYear;
            currentMonth = pickMonth;
            currentDay = 1;
            closeSheet('picker-sheet');
            renderAll();
        }

        function updateColorSelect(selectedId) {
            const select = document.getElementById('task-color');
            const colors = getColors();
            const counts = colorUsageCounts();
            colors.forEach(c => { c.count = counts[c.id] || 0; });
            colors.sort((a, b) => (b.count || 0) - (a.count || 0));
            select.innerHTML = '';
            colors.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = `${c.name} (${c.count || 0})`;
                select.appendChild(opt);
            });
            // Default selection: provided id, else first (most-used) color
            const chosen = selectedId || (colors[0] && colors[0].id) || '';
            select.value = chosen;

            // Render color circles (sorted by usage), "+ new" last
            const wrap = document.getElementById('task-color-circles');
            wrap.innerHTML = '';

                circle.className = 'color-circle' + (c.id === chosen ? ' selected' : '');

        // Default reminder sets per cadence (spec 3.1d): each is min/hours/days/weeks before due

                { amount: '15', unit: 'minutes' },
                { amount: '1', unit: 'hours' },
                { amount: '2', unit: 'hours' },
                { amount: '4', unit: 'hours' }

                { amount: '12', unit: 'hours' },

        function addReminderRow(reminder = null) {
            const list = document.getElementById('reminders-list');
            const row = document.createElement('div');
            row.className = 'reminder-row';
            const input = document.createElement('input');
            input.type = 'number';
            input.min = '1';
            input.value = reminder ? reminder.amount : '10';
            const select = document.createElement('select');
            ['minutes','hours','days','weeks'].forEach(u => {
                const opt = document.createElement('option');

        function saveTask() {
            const title = document.getElementById('task-title').value.trim();
            if (!title) { alert('Please enter a title'); return; }

            const type = document.getElementById('task-type').value;
            const colorGroupId = document.getElementById('task-color').value;
            const description = document.getElementById('task-desc').value.trim();

            const task = {
                id: editingTaskId || genId(),
                title, type, colorGroupId, description,
                reminders: [],
                createdAt: editingTaskId ? undefined : new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                completed: false
            };

            if (type !== 'continuous') {
                const endVal = document.getElementById('task-end').value;
                if (!endVal) { alert('Please set an end date'); return; }
                const startVal = document.getElementById('task-start').value;
                if (startVal) task.startDate = new Date(startVal).toISOString();
                task.dueDate = new Date(endVal).toISOString();
                if (type === 'dynamic') {
                    task.originalDueDate = task.dueDate;
                    task.postponeCount = 0;
                }
            }

            // Cadence applies to every task: it presets reminders and, for
            // dynamic tasks, sets the auto-prolong step (D2D/W2W/M2M).
            task.reminderType = getSelectedCadence();

            // Reminders are taken from the visible (editable) rows for all types
            document.querySelectorAll('.reminder-row').forEach(row => {
                const amount = row.querySelector('input').value;
                const unit = row.querySelector('select').value;
                if (amount) task.reminders.push({ amount, unit });
            });

            const tasks = getTasks();
            if (editingTaskId) {
                const idx = tasks.findIndex(t => t.id === editingTaskId);
                if (idx >= 0) {
                    task.createdAt = tasks[idx].createdAt;
                    task.completed = tasks[idx].completed;
                    task.completedAt = tasks[idx].completedAt || null;
                    // Preserve fired reminder keys across edits
                    if (tasks[idx].firedReminders) task.firedReminders = tasks[idx].firedReminders;
                    // Keep the original date reference for dynamic tasks (spec 3.4)
                    if (type === 'dynamic' && tasks[idx].originalDueDate) {
                        task.originalDueDate = tasks[idx].originalDueDate;
                        task.postponeCount = tasks[idx].postponeCount || 0;
                    }
                    tasks[idx] = task;
                }
            } else {
                tasks.push(task);
            }

            saveTasks(tasks);
            // Immediately auto-prolong if a dynamic task was saved already overdue.
            prolongDynamicTasks();
            hideTaskModal();
            renderFilters();
            renderAll();
        }

        // ===== DIVIDER DRAG =====
        // Unified pointer/touch/mouse drag. Clamps the task-panel height between
        // 15% and 85% of the available app height. preventDefault while dragging
        // stops the page from scrolling / rubber-banding on Android WebView.
        let isDragging = false, startY = 0, startHeight = 0;
        const dividerEl = document.getElementById('divider');
        const taskPanelEl = document.getElementById('task-panel');

        function appHeight() {
            return (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        }
        function dragStart(clientY) {
            isDragging = true;
            startY = clientY;
            startHeight = taskPanelEl.offsetHeight;
            document.body.style.userSelect = 'none';
        }
        function dragMove(clientY) {
            if (!isDragging) return;
            const deltaY = startY - clientY;
            const h = appHeight();
            const minH = h * 0.15;
            const maxH = h * 0.85;
            taskPanelEl.style.height = Math.max(minH, Math.min(maxH, startHeight + deltaY)) + 'px';
        }
        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            document.body.style.userSelect = '';
        }

        // Pointer Events cover both touch and mouse on modern WebViews.
        if (window.PointerEvent) {
            dividerEl.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                dragStart(e.clientY);
                if (dividerEl.setPointerCapture) {
                    try { dividerEl.setPointerCapture(e.pointerId); } catch (_) {}
                }
            });
            document.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                dragMove(e.clientY);
            }, { passive: false });
            document.addEventListener('pointerup', dragEnd);
            document.addEventListener('pointercancel', dragEnd);
        } else {
            // Fallback: explicit touch + mouse handlers.
            dividerEl.addEventListener('touchstart', (e) => {
                e.preventDefault();
                dragStart(e.touches[0].clientY);
            }, { passive: false });
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                dragMove(e.touches[0].clientY);
            }, { passive: false });
            document.addEventListener('touchend', dragEnd);
            document.addEventListener('touchcancel', dragEnd);
            dividerEl.addEventListener('mousedown', (e) => { e.preventDefault(); dragStart(e.clientY); });
            document.addEventListener('mousemove', (e) => { if (isDragging) dragMove(e.clientY); });
            document.addEventListener('mouseup', dragEnd);
        }

        // ===== PINCH ZOOM =====
        let weekHeight = 80; // Base height in px
        let daysZoom = 7; // 7, 5, or 3 days visible
        let pinchStartDistance = 0;
        let pinchStartAngle = 0;
        let pinchStartHeight = 80;
        let pinchStartDaysZoom = 7;
        let isPinching = false;

        function getDistance(touch1, touch2) {
            const dx = touch2.clientX - touch1.clientX;
            const dy = touch2.clientY - touch1.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getAngle(touch1, touch2) {
            const dx = touch2.clientX - touch1.clientX;
            const dy = touch2.clientY - touch1.clientY;
            return Math.atan2(dy, dx) * 180 / Math.PI;
        }

        function applyZoom() {
            // Apply vertical zoom (week height)
            const monthView = document.getElementById('month-view');
            const scrollView = document.getElementById('scroll-view');

            // Retain the top-most visible week across a vertical zoom so the same
            // future weeks stay in view (rule: width retained, week anchor kept).
            let anchorWeek = 0;
            const prevWeekHeight = parseFloat(scrollView.style.getPropertyValue('--week-height')) || weekHeight;
            if (currentView === 'scroll' && prevWeekHeight > 0) {
                anchorWeek = scrollView.scrollTop / prevWeekHeight;
            }

            monthView.style.setProperty('--week-height', weekHeight + 'px');
            scrollView.style.setProperty('--week-height', weekHeight + 'px');

            if (currentView === 'scroll') {
                scrollView.scrollTop = anchorWeek * weekHeight;
            }

            // Apply horizontal zoom (days visible)
            const weekRows = document.querySelectorAll('.week-row');
            weekRows.forEach(row => {
                row.classList.remove('zoom-5', 'zoom-3');
                if (daysZoom === 5) row.classList.add('zoom-5');
                else if (daysZoom === 3) row.classList.add('zoom-3');
            });

            // Update day headers grid + visibility so columns align with cells
            const dayHeadersEl = document.querySelector('.day-headers');
            if (dayHeadersEl) {
                dayHeadersEl.classList.remove('zoom-5', 'zoom-3');
                if (daysZoom === 5) dayHeadersEl.classList.add('zoom-5');
                else if (daysZoom === 3) dayHeadersEl.classList.add('zoom-3');
            }
            const dayHeaders = document.querySelectorAll('.day-header');
            const visibleCount = daysZoom;
            dayHeaders.forEach((header, i) => {
                header.style.display = i < visibleCount ? 'block' : 'none';
            });
        }

        function handlePinchStart(e) {
            if (e.touches.length === 2) {
                isPinching = true;
                pinchStartDistance = getDistance(e.touches[0], e.touches[1]);
                pinchStartAngle = getAngle(e.touches[0], e.touches[1]);
                pinchStartHeight = weekHeight;
                pinchStartDaysZoom = daysZoom;
                e.preventDefault();
            }
        }

        function handlePinchMove(e) {
            if (!isPinching || e.touches.length !== 2) return;
            e.preventDefault();

            const currentDistance = getDistance(e.touches[0], e.touches[1]);
            const currentAngle = getAngle(e.touches[0], e.touches[1]);

            // Calculate scale ratio
            const ratio = currentDistance / pinchStartDistance;

            // Determine if gesture is more vertical or horizontal
            const absAngle = Math.abs(currentAngle);

            // Horizontal pinch (angle close to 0 or 180) - change days visible
            if (absAngle < 45 || absAngle > 135) {
                if (ratio < 0.7 && pinchStartDaysZoom === 7) {
                    daysZoom = 5;
                } else if (ratio < 0.5 && pinchStartDaysZoom >= 5) {
                    daysZoom = 3;
                } else if (ratio > 1.3 && pinchStartDaysZoom === 3) {
                    daysZoom = 5;
                } else if (ratio > 1.5 && pinchStartDaysZoom <= 5) {
                    daysZoom = 7;
                }
            }
            // Vertical pinch (angle close to 90) - change week height
            else {
                weekHeight = Math.max(40, Math.min(160, pinchStartHeight * ratio));
            }

            applyZoom();
        }

        function handlePinchEnd(e) {
            if (!e.touches || e.touches.length < 2) {
                isPinching = false;
            }
        }

        // Add pinch listeners to calendar views
        ['month-view', 'scroll-view'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', handlePinchStart, { passive: false });
            el.addEventListener('touchmove', handlePinchMove, { passive: false });
            el.addEventListener('touchend', handlePinchEnd);
            el.addEventListener('touchcancel', handlePinchEnd);
        });

        // Linear view pinch zoom (for day width)
        let linearPinchStart = 0;
        let linearPinchStartWidth = 80;
        let linearPinchStartDays = 14;
        const linearView = document.getElementById('linear-view');
        linearView.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                linearPinchStart = getDistance(e.touches[0], e.touches[1]);
                linearPinchStartWidth = linearDayWidth;
                linearPinchStartDays = linearDaysVisible;
                e.preventDefault();
            }
        }, { passive: false });
        linearView.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && linearPinchStart > 0) {
                e.preventDefault();
                const dist = getDistance(e.touches[0], e.touches[1]);
                const ratio = dist / linearPinchStart;
                // Pinch to change day width and days visible
                linearDayWidth = Math.max(40, Math.min(160, linearPinchStartWidth * ratio));
                // Inverse relationship - smaller width = more days
                linearDaysVisible = Math.max(7, Math.min(30, Math.round(linearPinchStartDays / ratio)));
                renderLinearView();
            }
        }, { passive: false });
        linearView.addEventListener('touchend', (e) => { if (!e.touches || e.touches.length < 2) linearPinchStart = 0; });
        linearView.addEventListener('touchcancel', () => { linearPinchStart = 0; });

        // ===== EVENT LISTENERS =====

            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            currentDay = now.getDate();

        document.getElementById('next-btn').onclick = nextMonth;
        document.getElementById('month-title').onclick = showPicker;
        document.getElementById('view-toggle').onclick = toggleView;
        document.getElementById('settings-btn').onclick = showSettings;
        document.getElementById('fab').onclick = () => showTaskModal();
        document.getElementById('add-reminder-btn').onclick = () => addReminderRow();
        document.getElementById('task-type').onchange = updateTypeVisibility;
        // Switching cadence re-fills the reminder list with that cadence's defaults
        document.querySelectorAll('input[name="rtype"]').forEach(r => { r.onchange = applyCadencePresets; });
        document.getElementById('save-btn').onclick = saveTask;
        document.getElementById('cancel-btn').onclick = hideTaskModal;
        document.getElementById('save-color-btn').onclick = saveColor;
        document.getElementById('cancel-color-btn').onclick = hideColorModal;
        document.getElementById('export-btn').onclick = exportData;
        document.getElementById('import-btn').onclick = () => document.getElementById('import-file').click();
        document.getElementById('import-file').onchange = (e) => { if (e.target.files[0]) importData(e.target.files[0]); };
        document.getElementById('clear-btn').onclick = clearData;
        document.getElementById('notif-toggle').onchange = (e) => {
            const settings = getSettings();
            settings.notifications = e.target.checked;
            saveSettings(settings);
            if (e.target.checked && 'Notification' in window) Notification.requestPermission();
        };

        // Close modals
        document.querySelectorAll('.close-btn').forEach(btn => {
            btn.onclick = () => btn.closest('.modal').classList.remove('active');
        });
        document.querySelectorAll('.modal').forEach(modal => {
            modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };
        });

        // ===== Bottom sheets: scrim/grip close + swipe-down to dismiss =====
        document.querySelectorAll('.sheet-scrim[data-close]').forEach(scrim => {
            scrim.onclick = () => closeSheet(scrim.dataset.close);
        });
        document.querySelectorAll('.sheet').forEach(sheet => {
            const panel = sheet.querySelector('.sheet-panel');
            let sy = 0, dragging = false, moved = 0;
            panel.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                // Only start drag-to-dismiss from the upper grip/header region
                const top = panel.getBoundingClientRect().top;
                if (e.touches[0].clientY - top > 70) return;
                sy = e.touches[0].clientY; dragging = true; moved = 0;
                panel.style.transition = 'none';
            }, { passive: true });
            panel.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                moved = Math.max(0, e.touches[0].clientY - sy);
                panel.style.transform = `translateY(${moved}px)`;
            }, { passive: true });
            panel.addEventListener('touchend', () => {
                if (!dragging) return;
                dragging = false;
                panel.style.transition = '';
                panel.style.transform = '';
                if (moved > 90) closeSheet(sheet.id);
            });
        });

        // Task detail actions
        document.getElementById('detail-edit-btn').onclick = () => {
            const t = getTasks().find(x => x.id === detailTaskId);
            closeSheet('detail-sheet');
            if (t) showTaskModal(t);
        };
        document.getElementById('detail-done-btn').onclick = () => {
            if (detailTaskId) { toggleTask(detailTaskId); closeSheet('detail-sheet'); }
        };
        document.getElementById('detail-delete-btn').onclick = () => {
            if (detailTaskId && confirm('Delete this task?')) {
                const tasks = getTasks().filter(t => t.id !== detailTaskId);
                saveTasks(tasks);
                closeSheet('detail-sheet');
                renderAll();
            }
        };

        // ===== VIEWPORT / RESIZE =====
        // Keep layout height in sync with the visual viewport so the task form
        // inputs are never hidden behind the Android soft keyboard, and so the
        // layout adapts on rotate / WebView chrome changes.
        function syncViewportHeight() {
            const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
            document.body.style.setProperty('--app-height', h + 'px');
        }

        // Default: 4 weeks visible above the divider. Compute the week height
        // from the actual available calendar area so 4 rows fit.
        let weekHeightInitialized = false;
        function computeDefaultWeekHeight() {
            if (weekHeightInitialized) return;
            const wrap = document.getElementById('calendar-wrap');
            const headers = document.querySelector('.day-headers');
            if (!wrap) return;
            const headerH = headers && !headers.classList.contains('hidden') ? headers.offsetHeight : 0;
            const avail = wrap.clientHeight - headerH;
            if (avail > 0) {
                weekHeight = Math.max(40, Math.min(160, Math.floor(avail / 4)));
                weekHeightInitialized = true;
                applyZoom();
            }
        }

        function onViewportChange() {
            syncViewportHeight();
            // Re-anchor scroll view current-week position after a resize.
            if (currentView === 'scroll') {
                const container = document.getElementById('scroll-view');
                if (container && container.firstChild) {
                    // keep header month label in sync; scroll handler recalculates.
                }
            }
        }
        window.addEventListener('resize', onViewportChange);
        window.addEventListener('orientationchange', () => setTimeout(onViewportChange, 200));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncViewportHeight);
        }

        // ===== INIT =====
        syncViewportHeight();
        // Run auto-prolong before the first render so overdue dynamic tasks land
        // on/after today, then render.
        prolongDynamicTasks();
        renderFilters();
        renderAll();
        // Defer week-height computation until layout has settled.
        setTimeout(() => { computeDefaultWeekHeight(); renderAll(); }, 50);
        // Fire reminders shortly after load (give Notification permission a chance).
        setTimeout(checkReminders, 1500);
        // Once-per-minute tick: prolong dynamic tasks + check reminders.
        setInterval(periodicTick, 30000);
    </script>
</body>
</html>
