<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="description" content="HABIT Calendar">
    <title>HABIT Calendar</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header id="month-year-header">
        <button id="menu-toggle">☰</button>
        <h1 id="current-month-year">November 2025</h1>
        <button id="today-btn">Today</button>
        <button id="prev-month">‹</button>
        <button id="next-month">›</button>
        <div class="header-spacer"></div>
        <button id="settings-btn">⚙</button>
    </header>

    <!-- Main Container -->
    <div id="main-container">
        <!-- Sidebar -->
        <aside id="filter-sidebar">
            <h3>My calendars</h3>
            <div id="color-filters"></div>
        </aside>

        <!-- Content -->
        <div id="content-container">
            <!-- Calendar -->
            <section id="calendar-section">
                <div id="calendar-grid">
                    <div class="week-header">
                        <div class="day-name">Mon</div>
                        <div class="day-name">Tue</div>
                        <div class="day-name">Wed</div>
                        <div class="day-name">Thu</div>
                        <div class="day-name">Fri</div>
                        <div class="day-name">Sat</div>
                        <div class="day-name">Sun</div>
                    </div>
                    <div id="weeks-container"></div>
                </div>
            </section>

            <!-- Divider -->
            <div id="split-divider">
                <div id="divider-handle"></div>
            </div>

            <!-- Task List -->
            <section id="task-list-section">
                <h2>Tasks</h2>
                <div id="task-list"></div>
            </section>
        </div>
    </div>

    <!-- FAB -->
    <button id="add-task-btn">+</button>

    <!-- Task Modal -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" placeholder="Add title" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="task-color">Calendar</label>
                    <div id="color-group-selector">
                        <select id="task-color" required></select>
                        <button type="button" id="add-color-btn">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="task-type">Type</label>
                    <select id="task-type" required>
                        <option value="fixed">Fixed</option>
                        <option value="continuous">Continuous</option>
                        <option value="dynamic">Dynamic</option>
                    </select>
                </div>
                <div class="form-group" id="datetime-group">
                    <label for="task-start-date">Start</label>
                    <input type="datetime-local" id="task-start-date">
                    <label for="task-due-date">End</label>
                    <input type="datetime-local" id="task-due-date" required>
                </div>
                <div class="form-group" id="reminder-type-group" style="display: none;">
                    <label>Reminder Type</label>
                    <div class="radio-group">
                        <label><input type="radio" name="reminder-type" value="D2D"> D2D</label>
                        <label><input type="radio" name="reminder-type" value="W2W"> W2W</label>
                        <label><input type="radio" name="reminder-type" value="M2M" checked> M2M</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Reminders</label>
                    <div id="reminders-container"></div>
                    <button type="button" id="add-reminder-btn">+ Add reminder</button>
                </div>
                <div class="form-group">
                    <label for="task-description">Description</label>
                    <textarea id="task-description" rows="2" maxlength="500"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancel-task-btn">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Day Modal -->
    <div id="day-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="day-modal-title">November 19</h2>
            <div id="day-tasks-list"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Settings</h2>
            <div class="settings-section">
                <h3>Notifications</h3>
                <label class="switch">
                    <input type="checkbox" id="enable-notifications">
                    <span class="slider"></span>
                    Enable notifications
                </label>
                <button id="test-notification-btn" class="btn-secondary">Test</button>
            </div>
            <div class="settings-section">
                <h3>Data</h3>
                <button id="export-data-btn" class="btn-secondary">Export</button>
                <button id="import-data-btn" class="btn-secondary">Import</button>
                <input type="file" id="import-file-input" accept=".json" style="display: none;">
                <button id="clear-data-btn" class="btn-danger">Clear all</button>
            </div>
        </div>
    </div>

    <!-- Color Modal -->
    <div id="color-modal" class="modal">
        <div class="modal-content small">
            <span class="close-modal">&times;</span>
            <h2>New Calendar</h2>
            <form id="color-form">
                <div class="form-group">
                    <label for="color-name">Name</label>
                    <input type="text" id="color-name" required maxlength="30">
                </div>
                <div class="form-group">
                    <label for="color-picker">Color</label>
                    <input type="color" id="color-picker" value="#1a73e8" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary cancel-color-btn">Cancel</button>
                    <button type="submit" class="btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script src="validation.js"></script>
    <script src="storage.js"></script>
    <script src="notifications.js"></script>
    <script src="tasks.js"></script>
    <script src="calendar.js"></script>
    <script src="gestures.js"></script>
    <script src="app.js"></script>
</body>
</html>
